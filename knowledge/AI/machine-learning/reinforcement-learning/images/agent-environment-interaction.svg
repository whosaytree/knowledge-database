<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Agent-environment interaction loop</title>
  <desc id="desc">A reinforcement learning interaction loop where the agent sends an action to the environment, and the environment returns state and reward to the agent.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f2933"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="920" height="360" fill="#ffffff"/>

  <rect x="372" y="42" width="176" height="74" rx="14" fill="#f8fafc" stroke="#111827" stroke-width="3" filter="url(#shadow)"/>
  <text x="460" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#111827">Agent</text>

  <rect x="342" y="222" width="236" height="76" rx="14" fill="#f8fafc" stroke="#111827" stroke-width="3" filter="url(#shadow)"/>
  <text x="460" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#111827">Environment</text>

  <path d="M548 78 H710 V260 H590" fill="none" stroke="#111827" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="724" y="164" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#111827">action</text>
  <text x="724" y="198" font-family="Georgia, serif" font-size="24" font-style="italic" fill="#111827">A<tspan baseline-shift="sub" font-size="16">t</tspan></text>

  <path d="M342 260 H166 V78 H360" fill="none" stroke="#111827" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="110" y="148" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#111827">state</text>
  <text x="130" y="182" font-family="Georgia, serif" font-size="24" font-style="italic" fill="#111827">S<tspan baseline-shift="sub" font-size="16">t</tspan></text>

  <path d="M342 236 H210 V112 H360" fill="none" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="220" y="148" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#111827">reward</text>
  <text x="220" y="182" font-family="Georgia, serif" font-size="23" font-style="italic" fill="#111827">R<tspan baseline-shift="sub" font-size="15">t</tspan></text>

  <line x1="282" y1="208" x2="282" y2="300" stroke="#4b5563" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M342 252 H292" fill="none" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="308" y="240" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#111827">R<tspan baseline-shift="sub" font-size="13">t+1</tspan></text>
  <text x="308" y="270" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#111827">S<tspan baseline-shift="sub" font-size="13">t+1</tspan></text>

  <text x="460" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4b5563">
    Agent-environment interaction in reinforcement learning
  </text>
</svg>
