<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">Recycling robot finite MDP</title>
  <desc id="desc">A table and state-transition diagram for the recycling robot finite Markov decision process with high and low battery states.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,5 L1,9 Z" fill="#1f2933"/>
    </marker>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
      .math { font-family: Georgia, "Times New Roman", serif; fill: #111827; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; fill: #111827; }
      .muted { fill: #4b5563; }
    </style>
  </defs>

  <rect width="1120" height="430" fill="#ffffff"/>

  <text x="26" y="34" class="label" font-size="22" font-weight="700">Transition and reward model</text>
  <line x1="24" y1="56" x2="520" y2="56" stroke="#111827" stroke-width="2"/>
  <line x1="255" y1="34" x2="255" y2="346" stroke="#111827" stroke-width="1.5"/>
  <line x1="395" y1="34" x2="395" y2="346" stroke="#111827" stroke-width="1.5"/>

  <text x="34" y="82" class="math" font-size="22" font-style="italic">s</text>
  <text x="112" y="82" class="math" font-size="22" font-style="italic">a</text>
  <text x="205" y="82" class="math" font-size="22" font-style="italic">s'</text>
  <text x="280" y="82" class="math" font-size="22" font-style="italic">p(s' | s, a)</text>
  <text x="420" y="82" class="math" font-size="22" font-style="italic">r(s, a, s')</text>

  <g class="mono" font-size="20">
    <text x="34" y="116">high</text><text x="112" y="116">search</text><text x="205" y="116">high</text><text x="280" y="116">α</text><text x="420" y="116">r_search</text>
    <text x="34" y="146">high</text><text x="112" y="146">search</text><text x="205" y="146">low</text><text x="280" y="146">1−α</text><text x="420" y="146">r_search</text>
    <text x="34" y="176">low</text><text x="112" y="176">search</text><text x="205" y="176">high</text><text x="280" y="176">1−β</text><text x="420" y="176">−3</text>
    <text x="34" y="206">low</text><text x="112" y="206">search</text><text x="205" y="206">low</text><text x="280" y="206">β</text><text x="420" y="206">r_search</text>
    <text x="34" y="236">high</text><text x="112" y="236">wait</text><text x="205" y="236">high</text><text x="280" y="236">1</text><text x="420" y="236">r_wait</text>
    <text x="34" y="266">high</text><text x="112" y="266">wait</text><text x="205" y="266">low</text><text x="280" y="266">0</text><text x="420" y="266">-</text>
    <text x="34" y="296">low</text><text x="112" y="296">wait</text><text x="205" y="296">high</text><text x="280" y="296">0</text><text x="420" y="296">-</text>
    <text x="34" y="326">low</text><text x="112" y="326">wait</text><text x="205" y="326">low</text><text x="280" y="326">1</text><text x="420" y="326">r_wait</text>
    <text x="34" y="356">low</text><text x="112" y="356">recharge</text><text x="205" y="356">high</text><text x="280" y="356">1</text><text x="420" y="356">0</text>
  </g>

  <text x="720" y="34" class="label" font-size="22" font-weight="700">State-transition diagram</text>

  <circle cx="705" cy="220" r="44" fill="#f8fafc" stroke="#111827" stroke-width="2"/>
  <text x="705" y="228" text-anchor="middle" class="mono" font-size="26">high</text>

  <circle cx="955" cy="220" r="44" fill="#f8fafc" stroke="#111827" stroke-width="2"/>
  <text x="955" y="228" text-anchor="middle" class="mono" font-size="26">low</text>

  <path d="M682 181 C610 95 720 50 750 155" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="602" y="75" class="math" font-size="20">1, r_wait</text>
  <text x="635" y="128" class="mono" font-size="20">wait</text>

  <path d="M724 262 C758 340 872 340 925 258" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="795" y="363" class="math" font-size="20">1−α, r_search</text>
  <text x="710" y="317" class="mono" font-size="20">search</text>

  <path d="M929 181 C880 82 770 75 720 177" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="807" y="76" class="math" font-size="20">1−β, −3</text>
  <text x="875" y="125" class="mono" font-size="20">search</text>

  <path d="M999 220 C1068 150 1082 290 993 264" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1010" y="78" class="math" font-size="20">β, r_search</text>
  <text x="1007" y="175" class="mono" font-size="20">search</text>

  <path d="M960 265 C1014 322 927 358 914 269" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1000" y="354" class="math" font-size="20">1, r_wait</text>
  <text x="956" y="316" class="mono" font-size="20">wait</text>

  <path d="M911 220 H749" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="808" y="197" class="math" font-size="20">1, 0</text>
  <text x="813" y="233" class="mono" font-size="20">recharge</text>

  <text x="560" y="404" class="label muted" text-anchor="middle" font-size="18">
    Recycling robot as a finite MDP: states are battery levels; actions change transition probabilities and rewards.
  </text>
</svg>
